<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f0f8ff;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Hello, World!</h1>
    <p>Click the button below.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("HTML, CSS, and JavaScript are working!");
        }
    </script>

</body>
